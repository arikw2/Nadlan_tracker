name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk

      - name: Rename APK for release
        run: mv app-debug.apk "nadlan-tracker-$VERSION.apk"

      - name: Create GitHub release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: "נדל״ן טרקר ${{ env.VERSION }}"
          files: nadlan-tracker-*.apk
          generate_release_notes: true
          body: |
            אפליקציית אנדרואיד למעקב אחר שוק הנדל״ן בישראל — נתונים רשמיים בלבד.

            **התקנה:** הורידו את קובץ ה־APK המצורף למכשיר אנדרואיד (8.0 ומעלה),
            אשרו התקנה ממקור לא מוכר, והתקינו.

            **פיצ׳רים:** חיפוש עסקאות אמיתיות (רחוב/שכונה/יישוב/רדיוס) עם מחירים
            מרשות המסים · גרפים של מחיר חציוני, ₪/מ״ר ומספר עסקאות · מפה עם
            עסקאות צבועות לפי מחיר · מדדי הדיור והשכירות של הלמ״ס · מועדפים ·
            השוואת אזורים · התראות על עסקאות חדשות.
